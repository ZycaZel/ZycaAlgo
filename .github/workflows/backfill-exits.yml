name: Backfill missing exits (manual)

# One-off repair, run by hand. Exits closed before manage_exits logged them
# left no row in the trade log; this reconstructs them from Alpaca's order
# history. Defaults to a dry run - it will not write anything unless you
# explicitly set apply to true.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually write the rows (leave false to preview first)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Backfill
        working-directory: scripts
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python backfill_exits.py --apply
          else
            python backfill_exits.py
          fi

      - name: Commit recovered rows
        # Only possible when something was actually written; a dry run leaves
        # the tree clean and this becomes a no-op.
        run: |
          git config user.name "zycaalgo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trades.md data/trades.json
          git diff --cached --quiet || git commit -m "Backfill exits missing from the trade log"
          git push
