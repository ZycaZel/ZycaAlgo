name: ZycaAlgo daily scan + paper trade

on:
  schedule:
    # 08:00 UTC = 15:00 Asia/Bangkok. Runs Tue-Sat (UTC), not Mon-Fri, because
    # SEC's daily index for a trading day isn't published until after their
    # 10pm ET same-day filing cutoff - it's only actually ready the *next*
    # UTC morning. So a Tuesday run picks up Monday's filings, Wednesday
    # picks up Tuesday's, etc., through Saturday picking up Friday's.
    # (No Sunday/Monday runs - there's no new trading-day data to catch.)
    - cron: "0 8 * * 2-6"
    # Backup trigger, 5 hours after the primary (13:00 UTC = 20:00 Bangkok).
    # GitHub drops scheduled runs during high load, and a run that never
    # starts can't fail - so the "Alert on failure" step at the bottom is
    # blind to it (that only fires on a run that started, then broke).
    # This second attempt catches that case. The `guard` job below makes it
    # a no-op on days the primary run already succeeded.
    - cron: "0 13 * * 2-6"
  workflow_dispatch: {}   # lets you click "Run workflow" manually in the Actions tab

permissions:
  contents: write   # needed so the job can commit updated data/ and trades.md back
  actions: read     # needed so the guard job can see whether today's run already succeeded

jobs:
  guard:
    # Decides whether the work below actually needs doing. Only ever says
    # "no" for the backup cron on a day the primary run already succeeded.
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Decide whether this run is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          REPO: ${{ github.repository }}
        run: |
          # The primary schedule and any manual "Run workflow" click always run.
          if [ "$EVENT_NAME" != "schedule" ] || [ "$CRON" != "0 13 * * 2-6" ]; then
            echo "Primary schedule or manual dispatch - proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Backup cron: only do the work if no run has succeeded yet today.
          # Deliberately fails open - if the API query itself breaks we'd
          # rather scan twice than skip a day, since a skipped day is the
          # exact bug this whole mechanism exists to fix.
          today=$(date -u +%Y-%m-%d)
          runs=$(gh api "repos/$REPO/actions/workflows/daily-job.yml/runs?per_page=30&status=success" \
                   --jq "[.workflow_runs[] | select(.created_at | startswith(\"$today\"))] | length") || runs=""
          if [ -z "$runs" ]; then
            echo "Couldn't query today's runs - failing open and proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$runs" -gt 0 ]; then
            echo "$runs successful run(s) already completed today - nothing to catch up on."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No successful run today - the primary schedule was dropped. Catching up."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Announce that the backup trigger had to step in
        # Worth knowing about: it means GitHub dropped the primary run.
        if: steps.check.outputs.should_run == 'true' && github.event.schedule == '0 13 * * 2-6'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set - skipping notice."
            exit 0
          fi
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"**ZycaAlgo**: today's primary scheduled run never started (GitHub dropped it). The backup trigger is running the scan now - <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}"

  run:
    needs: guard
    if: needs.guard.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run SEC Form 4 scan
        working-directory: scripts
        run: python insider_buys.py

      - name: Publish today's scan to data/latest.json
        working-directory: scripts
        run: |
          latest=$(ls -t insider-buys-*.json | head -n 1)
          mkdir -p ../data/archive
          cp "$latest" ../data/latest.json
          cp "$latest" "../data/archive/$latest"

      - name: Rebuild the public watchlist
        working-directory: scripts
        run: python build_watchlist.py

      - name: Push today's signals to Notion watchlist
        working-directory: scripts
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python push_signals_to_notion.py ../data/latest.json

      - name: Post today's signals to Discord
        working-directory: scripts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python discord_notify.py ../data/latest.json

      - name: Email watchlist alerts to opted-in users
        # Only mails users who explicitly switched alerts on at /account
        # (email_alerts defaults to false), and only when a ticker they
        # follow actually appears in today's signals. No-op without the
        # Resend secrets below.
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
        run: python email_alerts.py ../data/latest.json

      - name: Warn if the scanner has gone quiet
        # A job that succeeds while finding nothing looks identical to a job
        # that succeeds on a genuinely slow day - the failure alert can't tell
        # them apart because nothing actually failed. This catches a parser
        # that has silently stopped matching (e.g. SEC changed a format).
        working-directory: scripts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_scanner_health.py

      - name: Manage existing positions (stops / trailing / time-stop)
        working-directory: scripts
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python trade_manager.py manage

      - name: Enter today's qualifying signals
        working-directory: scripts
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python trade_manager.py enter ../data/latest.json

      - name: Place initial stops for today's new entries
        # manage() only places a position's first stop order once it sees the
        # position exist with stop_order_id still null - that's true right
        # after a same-day entry. Give paper-market fills a few seconds, then
        # run manage() again so today's new positions aren't left unprotected
        # until tomorrow's scheduled run.
        working-directory: scripts
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          sleep 15
          python trade_manager.py manage

      - name: Manage AI-managed traders' own accounts
        # Optional layer on top of the demo account above: every trader who
        # selected AI-managed mode and connected their own Alpaca paper
        # account (via /account) gets the same enter+manage logic run
        # against their own account, in their own separate state files
        # (data/users/<id>/) - never touches data/positions_state.json or
        # trades.md, which stay specific to the site's own demo account.
        # No-op (prints a message, exits 0) if the Supabase/encryption
        # secrets below aren't set, so this is fully optional infrastructure.
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
        run: python run_for_ai_managed_users.py ../data/latest.json

      - name: Friday weekly summary
        working-directory: scripts
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          if [ "$(date -u +%a)" = "Fri" ]; then
            python trade_manager.py summary >> ../data/weekly-summaries.md
          fi

      - name: Commit updated data
        run: |
          git config user.name "zycaalgo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ trades.md
          git diff --cached --quiet || git commit -m "Daily scan + paper trade update ($(date -u +%Y-%m-%d))"
          git push

      - name: Alert on failure
        # Runs only if any earlier step in this job failed - the whole point
        # is to notice a broken run without having to check manually.
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set - skipping failure alert."
            exit 0
          fi
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"**ZycaAlgo daily job FAILED** - <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}>\"}"
